{% extends 'base.html' %}
{% load tr_tags %}

{% block title %}{% tr "auth.login_title" %} - EduQuests{% endblock %}

{% block main_content %}
<div class="auth-wrapper page-enter">
  <div class="auth-card reveal-scale hover-lift">
    <div class="auth-header">
      <div class="auth-logo">Edu<span>Quests</span></div>
      <h2 class="auth-title">{% tr "auth.welcome_back" %}</h2>
      <p class="auth-subtitle">{% tr "auth.no_account" %} <a href="{% url 'register' %}">{% tr "auth.sign_up" %}</a></p>
    </div>
    <form method="POST" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label for="username_input">{% tr "auth.email_or_user" %}</label>
        <input type="text" id="username_input" name="username" class="form-input" required />
      </div>
      <div class="form-group">
        <label for="password_input">{% tr "auth.password" %}</label>
        <input type="password" id="password_input" name="password" class="form-input" required />
      </div>
      <button type="submit" class="btn btn-primary form-submit-btn">{% tr "auth.login_title" %}</button>
    </form>
    <div class="auth-footer">
      <p><a href="{% url 'forgot_password' %}">{% tr "auth.forgot" %}</a></p>
    </div>
  </div>
</div>
{% endblock %}
